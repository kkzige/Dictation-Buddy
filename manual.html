<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><title>手动录入 · 听写小助手</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;color:#203044;background:#f4f7fa}*{box-sizing:border-box}body{margin:0;padding:18px 16px 48px;max-width:720px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:22px;margin:5px 0}.tag{font-size:12px;color:#5a7895}a{color:#2f679e}a.back{display:inline-block;padding:10px 12px;text-decoration:none;background:#e5eef8;border-radius:10px;font-weight:700;font-size:13px}main{background:white;border:1px solid #e5eaf2;border-radius:20px;padding:18px;box-shadow:0 4px 22px #1c344414}.field{display:block;margin:0 0 16px;font-size:13px;font-weight:700;color:#526479}.field>span{display:block;margin-bottom:7px}input,select,textarea{font:inherit;width:100%;border:1px solid #d9e4ee;border-radius:12px;padding:12px;color:#172d40;background:#fff;font-size:16px}textarea{min-height:185px;resize:vertical;line-height:1.6}button{border:0;border-radius:11px;padding:13px 16px;background:#346d9f;color:#fff;font-size:15px;font-weight:750;min-height:47px;cursor:pointer}button.secondary{background:#edf3f8;color:#366891;border:1px solid #d5e3ee}button:disabled{opacity:.5}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.hint{color:#6e8195;font-size:12px;line-height:1.7}.status{background:#edf5fd;color:#27587c;padding:12px;border-radius:12px;font-size:13px;line-height:1.65;margin:12px 0}.error{background:#fff2ea;color:#8a452c}.item{display:flex;align-items:center;gap:7px;margin-bottom:7px}.item input{flex:1;min-width:0}.item button{background:#fff4f2;color:#b05045;border:1px solid #f1d9d5;padding:9px 12px;font-size:12px;min-height:40px;flex:none}#review[hidden],#entry[hidden],#newFields[hidden]{display:none!important}h2{font-size:15px;margin:22px 0 12px}button.full{width:100%}.muted{font-size:12px;color:#77889a}.pill{background:#edf4fa;border-radius:10px;padding:4px 8px;margin:2px;display:inline-block;font-size:12px}.field small{color:#8491a1;font-size:11px}
</style></head><body>
<header><div><div class="tag">DICTATION BUDDY · v0.3.8</div><h1>⌨ 手动录入</h1><div class="hint">独立录入页面，不需要弹窗或云服务。</div></div><a class="back" href="./">返回工具</a></header>
<main>
 <section id="entry"><label class="field"><span>保存到哪里？</span><select id="destination"><option value="new">＋ 新建词库</option></select></label>
 <div id="newFields"><label class="field"><span>新词库名称</span><input id="bankName" value="语文听写" maxlength="80" autocomplete="off"></label><label class="field"><span>语言</span><select id="lang"><option value="zh-CN">中文（空格自动分词）</option><option value="en-US">英文（按行保留短语）</option></select></label></div>
 <label class="field"><span>输入或粘贴词语</span><textarea id="terms" placeholder="中文例子：苹果 香蕉 葡萄&#10;也可以每行一个词语&#10;英文短语请切换为英文词库"></textarea><small>中文支持空格、换行、逗号、顿号、分号；英文每行一个短语。</small></label>
 <div class="row"><button class="full" id="previewBtn">下一步 · 核对词语</button></div><div id="count" class="status">输入后自动显示词语数量。</div>
 </section>
 <section id="review" hidden><div id="reviewStatus" class="status"></div><h2>核对词语（可以改字或删除）</h2><div id="rows"></div><div class="row"><button class="secondary" id="backBtn">返回修改</button><button id="saveBtn">保存词语</button></div></section>
 <p class="hint">提示：本页面与听写工具使用相同的本机词库数据。保存后点击「返回工具」，即可在词库中看到新增词语，再进行拼音标记和播报。更新程序不会主动清除词库，但建议定期在设置中导出 JSON 备份。</p>
 <div id="notice" class="status" role="status" hidden></div>
</main>
<script>
(function(){
'use strict';
const STORAGE='dictation-buddy-v0.1-data';
const $=s=>document.querySelector(s);
let db, entries=[];
function show(message,isError=false){const node=$('#notice');node.hidden=false;node.textContent=message;node.className='status'+(isError?' error':'');}
try{const value=localStorage.getItem(STORAGE);db=value?JSON.parse(value):{banks:[],groups:[],settings:{}};if(!db||!Array.isArray(db.banks)||!Array.isArray(db.groups))throw Error('数据结构异常');}catch(err){db=null;show('无法读取已有词库。为避免覆盖原数据，已禁用保存。请先在主程序中导出备份。',true);$('#previewBtn').disabled=true;}
function uid(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'manual-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
function lang(){const bank=db?.banks?.find(b=>b.id===$('#destination').value);return bank?.lang||$('#lang').value;}
function key(text){return String(text||'').trim().normalize('NFKC').toLowerCase();}
function parse(text){const chinese=lang()==='zh-CN';const tokens=chinese?text.split(/[\s,，、;；|]+/):text.split(/[\n,，、;；|]+/);const out=[],seen=new Set();for(let s of tokens){s=s.replace(/^\s*(?:(?:[（(]?\d{1,3}[)）]?[.．、:：]\s*)|(?:[•·●◆■◦-]\s*))/, '').trim();if(!s||seen.has(key(s)))continue;seen.add(key(s));out.push(s.slice(0,200));}return out;}
function drawBanks(){if(!db)return;for(const bank of db.banks){const option=document.createElement('option');option.value=bank.id;option.textContent=bank.title+'（'+(bank.lang==='en-US'?'英文':'中文')+'）';$('#destination').append(option);}refreshLang();}
function refreshLang(){const chosen=$('#destination').value;$('#newFields').hidden=chosen!=='new';$('#count').textContent='当前输入：'+parse($('#terms').value).length+' 个不重复词语'+(chosen==='new'?'':(' · 添加到现有词库'));}
function savePrecheck(){if(!db)return;const dest=$('#destination').value;if(dest==='new'&&!$('#bankName').value.trim()){show('请输入词库名称。',true);return;}entries=parse($('#terms').value);if(!entries.length){show('请先输入词语。',true);return;}$('#entry').hidden=true;$('#review').hidden=false;drawReview();}
function drawReview(){const rows=$('#rows');rows.innerHTML='';for(let i=0;i<entries.length;i++){const div=document.createElement('div');div.className='item';const input=document.createElement('input');input.value=entries[i];input.setAttribute('aria-label','第'+(i+1)+'个词语');input.addEventListener('change',()=>entries[i]=input.value);const button=document.createElement('button');button.textContent='删除';button.type='button';button.addEventListener('click',()=>{entries.splice(i,1);drawReview()});div.append(input,button);rows.append(div);}$('#reviewStatus').textContent='识别到 '+entries.length+' 个词语。保存前可修改、删除，重复词语会被自动跳过。';}
function doSave(){if(!db)return;const dest=$('#destination').value;const old=dest==='new'?null:db.banks.find(x=>x.id===dest);if(dest!=='new'&&!old){show('目标词库已不存在。',true);return;}const name=$('#bankName').value.trim();const existing=new Set((old?.items||[]).map(x=>key(x.text)));const items=[];let dup=0;for(const word of entries){const text=String(word||'').trim().slice(0,200);if(!text)continue;const k=key(text);if(existing.has(k)){dup++;continue;}existing.add(k);items.push({id:uid(),text,marks:[]});}if(!items.length){show('没有需要新增的词语：全部已存在或为空。',true);return;}const previous=localStorage.getItem(STORAGE);try{if(old){old.items.push(...items);}else{db.banks.unshift({id:uid(),title:name.slice(0,80),lang:lang(),createdAt:Date.now(),items});}localStorage.setItem(STORAGE,JSON.stringify(db));}catch(e){if(previous!==null)try{localStorage.setItem(STORAGE,previous)}catch{}show('保存失败：请检查 Safari 储存空间。',true);return;}$('#review').hidden=true;$('#entry').hidden=false;$('#terms').value='';entries=[];refreshLang();show('已保存 '+items.length+' 个词语'+(dup?'（跳过 '+dup+' 个重复项）':'')+'。点击「返回工具」查看。');}
$('#terms').addEventListener('input',refreshLang);$('#destination').addEventListener('change',refreshLang);$('#lang').addEventListener('change',refreshLang);$('#previewBtn').addEventListener('click',savePrecheck);$('#backBtn').addEventListener('click',()=>{$('#entry').hidden=false;$('#review').hidden=true;});$('#saveBtn').addEventListener('click',doSave);drawBanks();
})();
</script></body></html>
