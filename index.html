<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="在 iPhone 上拍照导入中文和英文词语，组合词库，顺序或随机听写，并为指定汉字提示写拼音。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="听写小助手">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=0.3.7">
  <title>听写小助手</title>
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <div class="brand-icon" aria-hidden="true">听</div>
      <div class="brand-title"><span>听写小助手</span><small>Dictation Buddy · v0.3.7</small></div>
      <a class="top-manual-link" href="./manual.html" aria-label="独立手动录入页面">⌨ 手动录入</a>
      <button class="icon-button" type="button" id="quickHelp" aria-label="使用帮助" title="使用帮助">?</button>
    </header>
    <main id="mainContent" aria-live="off"></main>
    <div id="selectionBar" class="selection-bar" hidden></div>
    <nav class="bottom-nav" aria-label="主要栏目">
      <button type="button" class="nav-button active" data-tab="banks"><span class="nav-icon">▦</span><span>词库</span></button>
      <button type="button" class="nav-button" data-tab="groups"><span class="nav-icon">▣</span><span>组合</span></button>
      <button type="button" class="nav-button" data-tab="practice"><span class="nav-icon">◉</span><span>听写</span></button>
      <button type="button" class="nav-button" data-tab="settings"><span class="nav-icon">⚙</span><span>设置</span></button>
    </nav>
  </div>
  <div id="overlay" class="overlay" hidden aria-hidden="true">
    <div class="overlay-scrim" data-action="close-modal"></div>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header"><h2 id="modalTitle"></h2><button class="icon-button" type="button" data-action="close-modal" aria-label="关闭">✕</button></header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalActionBar" class="modal-actionbar" hidden aria-label="识别步骤操作"></footer>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=0.3.7"></script>
</body>
</html>
